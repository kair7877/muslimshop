          desc_kk: "<b>Men's Bio Honey</b> — Оңтүстік-Шығыс Азияның экологиялық таза аймақтарында жиналған, Тонгкат Али тамырымен байытылған таза малайзиялық бал. Термиялық өңдеуден өтпейді — барлық пайдалы қасиеттерін сақтайды. <br><br><b>Әсері:</b> <br>• Лездік сергектік — әсері бірінші ампуладан-ақ басталады. <br>• Ердің эндокриндік және репродуктивті жүйесін сауықтырады. <br>• Ағзаны жасартады, тонус пен бұлшықет массасының өсуіне ықпал етеді. <br>• Құрамдағы Тонгкат Али дәстүрлі түрде либидоны күшейту және потенцияны арттыру үшін қолданылады. <br><br><b>Қолдану тәсілі:</b> 2–3 күнде 1 рет ампуланың 1/3 бөлігі, немесе тамақтану, жаттығу немесе жақындықтан жарты сағат бұрын. Курс кезінде тәулігіне шамамен 2 л су ішу, күніне 3 рет тамақтану және ұйқы режимін сақтау ұсынылады. <br><br><i>Дәрілік зат емес. Ара өнімдеріне аллергия болса қолданбаңыз. Курс алдында дәрігермен кеңесу ұсынылады.</i>" },

        { name: "BIO HERBS Royal Honey", name_kk: "BIO HERBS Royal Honey", price: "2 500 ₸", prefix: "bioherbs",
          desc: "<b>BIO HERBS Royal Honey</b> — оригинальный малазийский королевский мёд в удобных саше, произведённый на сертифицированных предприятиях GMP и Halal. <br><br><b>Действие:</b> <br>• Усиливает эрекцию, повышает половое желание и сексуальные ощущения. <br>• Уменьшает стресс, укрепляет физическую форму и восстанавливает энергию. <br>• Увеличивает физическую и умственную работоспособность. <br>• Улучшает регулирование почек, противодействует процессу старения. <br>• Способствует профилактике заболеваний мужской половой системы (простатит, аденома). <br>• Эффект сохраняется до 48 часов. <br><br><b>Состав:</b> натуральный тропический мёд, Тонгкат Али, маточное молочко, мака перуанская, женьшень, корень куркумы, экстракт трюфеля. <br><br><b>Способ применения:</b> 1/3–1/2 саше 1 раз в 2–3 дня, за 30–45 минут до еды, тренировки или близости. Можно принимать в чистом виде или растворить в тёплой воде. <br><br><i>Не является лекарственным средством. Противопоказания: высокое давление, диабет, несовершеннолетний возраст. Не рекомендуется женщинам.</i>",
          desc_kk: "<b>BIO HERBS Royal Honey</b> — GMP және Halal сертификатталған кәсіпорындарда өндірілген түпнұсқа малайзиялық патша балы, ыңғайлы сашеде. <br><br><b>Әсері:</b> <br>• Эрекцияны күшейтеді, жыныстық құштарлық пен сезімдерді арттырады. <br>• Стрессті азайтады, дене формасын нығайтады, энергияны қалпына келтіреді. <br>• Дене және ақыл-ой жұмыс қабілетін арттырады. <br>• Бүйрек реттелуін жақсартады, қартаю процесіне қарсы әрекет етеді. <br>• Ерлердің жыныс жүйесі ауруларының (простатит, аденома) алдын алуға көмектеседі. <br>• Әсері 48 сағатқа дейін сақталады. <br><br><b>Құрамы:</b> табиғи тропикалық бал, Тонгкат Али, ана сүті (маточное молочко), перу макасы, женьшень, куркума тамыры, трюфель сығындысы. <br><br><b>Қолдану тәсілі:</b> 2–3 күнде 1 рет саше 1/3–1/2 бөлігі, тамақтану, жаттығу немесе жақындықтан 30–45 минут бұрын. Таза күйінде немесе жылы суда ерітіп қабылдауға болады. <br><br><i>Дәрілік зат емес. Қарсы көрсетілімдер: жоғары қан қысымы, диабет, кәмелетке толмаған жас. Әйелдерге ұсынылмайды.</i>" },

        { name: "Пилюли «Мужская сила»", name_kk: "«Ер қуаты» пилюльдері", price: "7 000 ₸", prefix: "pills",
          desc: "<b>Пилюли «Мужская сила»</b> — традиционный восточный комплекс на основе женьшеня и пантов (рогов) марала — компонентов, веками используемых в тибетской и китайской медицине для укрепления мужского здоровья. <br><br><b>Действие:</b> <br>• Женьшень тонизирует организм, повышает физическую и половую выносливость, поддерживает уровень тестостерона. <br>• Панты марала традиционно применяются для укрепления почек, стимуляции сперматогенеза и общего омоложения организма. <br>• Комплекс способствует повышению либидо и общего жизненного тонуса. <br><br><b>Способ применения:</b> по 1 пилюле в день курсом, либо за 30–40 минут до близости для разового эффекта — точная схема указана на упаковке. <br><br><i>Не является лекарственным средством. Не рекомендуется при гипертонии, сердечно-сосудистых заболеваниях, детям и подросткам. Консультация врача перед применением обязательна.</i>",
          desc_kk: "<b>«Ер қуаты» пилюльдері</b> — тибет және қытай медицинасында ғасырлар бойы ерлер денсаулығын нығайту үшін қолданылатын женьшень мен марал мүйізі (панттар) негізіндегі дәстүрлі шығыс кешені. <br><br><b>Әсері:</b> <br>• Женьшень ағзаны тонизирлейді, дене және жыныстық төзімділікті арттырады, тестостерон деңгейін қолдайды. <br>• Марал панттары дәстүрлі түрде бүйректі нығайту, сперматогенезді ынталандыру және ағзаны жалпы жасарту үшін қолданылады. <br>• Кешен либидо мен жалпы өмірлік тонусты арттыруға ықпал етеді. <br><br><b>Қолдану тәсілі:</b> күніне 1 пилюльден курс бойынша, немесе жақындықтан 30–40 минут бұрын бір реттік әсер үшін — нақты схема қаптамада көрсетілген. <br><br><i>Дәрілік зат емес. Гипертония, жүрек-қантамыр аурулары кезінде, балалар мен жасөспірімдерге ұсынылмайды. Қолданар алдында дәрігермен кеңесу міндетті.</i>" },

        { name: "Набор для мужской силы", name_kk: "Ер қуатына арналған жинақ", price: "1 000 - 1 500 ₸", prefix: "menset",
          desc: "<b>Набор для мужской силы</b> — пробный сет из самых популярных позиций нашего магазина в разделе «Мужское здоровье»: эпимедиумные пасты, мёд и капсулы в уменьшенном формате. <br><br>Отличный способ познакомиться сразу с несколькими форматами (паста / мёд / капсулы) и подобрать то, что подойдёт именно вам, прежде чем покупать полноразмерную упаковку. Состав набора уточняйте у продавца — комплектация может меняться в зависимости от наличия. <br><br><i>Все входящие в набор товары не являются лекарственными средствами. Перед применением рекомендуется консультация врача.</i>",
          desc_kk: "<b>Ер қуатына арналған жинақ</b> — дүкенімізідің «Ерлер денсаулығы» бөліміндегі ең танымал тауарларынан жасалған сынама жинақ: эпимедиум пасталары, бал және капсулалар кішірейтілген форматта. <br><br>Толық көлемдегі қаптаманы сатып алмас бұрын бірнеше форматпен (паста / бал / капсула) бірден танысудың және өзіңізге нақты сай келетінін таңдаудың тамаша тәсілі. Жинақтың құрамын сатушыдан нақтылаңыз — жиынтық қолжетімділікке байланысты өзгеруі мүмкін. <br><br><i>Жинаққа кіретін барлық тауарлар дәрілік зат емес. Қолданар алдында дәрігермен кеңесу ұсынылады.</i>" },

        { name: "Big PENIS — стимулятор", name_kk: "Big PENIS — стимулятор", price: "2 000 ₸", prefix: "bigpenis",
          desc: "<b>Big PENIS</b> — препарат быстрого действия на растительной основе для уверенности и контроля во время близости. <br><br><b>Действие:</b> <br>• Полная готовность наступает уже через 15–20 минут после приёма. <br>• Активная фаза действия — до 4 часов. <br>• Помогает справиться с преждевременным семяизвержением, продлевая время близости. <br>• Способствует более яркой и уверенной эрекции. <br><br><b>Состав:</b> натуральные травяные экстракты-афродизиаки, без химических добавок. <br><br><b>Способ применения:</b> 1 таблетка за 20–30 минут до близости, запивая водой. Для общего поддержания тонуса — 1 таблетка раз в 3 дня. Не более 1 таблетки в сутки. <br><br><i>Не является лекарственным средством. Не совмещать с антибиотиками и другими стимуляторами. При слишком долгой эрекции после близости выпейте стакан холодной воды. Консультация врача перед применением обязательна.</i>",
          desc_kk: "<b>Big PENIS</b> — жақындық кезінде сенімділік пен бақылау үшін өсімдік негізіндегі тез әсер ететін препарат. <br><br><b>Әсері:</b> <br>• Толық дайындық қабылдағаннан кейін 15–20 минутта басталады. <br>• Белсенді әсер ету кезеңі — 4 сағатқа дейін. <br>• Ерте семяизвержениямен күресуге, жақындық уақытын ұзартуға көмектеседі. <br>• Айқынырақ және сенімдірек эрекцияға ықпал етеді. <br><br><b>Құрамы:</b> табиғи шөп-афродизиак сығындылары, химиялық қоспаларсыз. <br><br><b>Қолдану тәсілі:</b> жақындықтан 20–30 минут бұрын 1 таблетка, сумен ішіңіз. Жалпы тонусты қолдау үшін — 3 күнде 1 таблетка. Тәулігіне 1 таблеткадан артық емес. <br><br><i>Дәрілік зат емес. Антибиотиктермен және басқа стимуляторлармен қоспаңыз. Жақындықтан кейін эрекция тым ұзақ сақталса, бір стақан суық су ішіңіз. Қолданар алдында дәрігермен кеңесу міндетті.</i>" },

        { name: "GOLD 07 — Паста", name_kk: "GOLD 07 — паста", price: "5 500 ₸", prefix: "gold07",
          desc: "<b>GOLD 07</b> — турецкая медовая паста высокого очищения на основе эпимедиума для бодрости на весь день. <br><br><b>Действие:</b> <br>• Активный компонент икариин связывается с ферментом SHBG, благодаря чему улучшается кровоток и эректильная способность. <br>• Увеличивает количество и качество сперматозоидов. <br>• Поддерживает половое наполнение и общий тонус организма. <br><br><b>Состав:</b> эпимедиум, мёд, имбирь, экстракт трибулуса, тутовая патока, L-аргинин, маточное молочко, меласса, овёс, сибирский женьшень, семена тыквы, какао. <br><br><b>Способ применения:</b> по половине чайной ложки 1 раз в день, вечером после еды. <br><br><b>Упаковка:</b> 240–270 г. <br><br><i>Не является лекарственным средством. Перед применением рекомендуется консультация врача.</i>",
          desc_kk: "<b>GOLD 07</b> — күні бойы сергектік үшін эпимедиум негізіндегі жоғары тазартылған түрік бал пастасы. <br><br><b>Әсері:</b> <br>• Белсенді компонент икариин SHBG ферментімен байланысады, соның нәтижесінде қан ағымы мен эректильді қабілет жақсарады. <br>• Сперматозоидтардың санын және сапасын арттырады. <br>• Жыныстық толымдылық пен жалпы дене тонусын қолдайды. <br><br><b>Құрамы:</b> эпимедиум, бал, зімбір, трибулус сығындысы, тұт сірнесі, L-аргинин, ана сүті, меласса, сұлы, сібір женьшені, асқабақ тұқымы, какао. <br><br><b>Қолдану тәсілі:</b> күніне 1 рет жарты шай қасық, кешке тамақтан кейін. <br><br><b>Қаптама:</b> 240–270 г. <br><br><i>Дәрілік зат емес. Қолданар алдында дәрігермен кеңесу ұсынылады.</i>" },

        { name: "Золотой Олень", name_kk: "Алтын Бұғы", price: "4 000 ₸", prefix: "deer",
          desc: "<b>Золотой Олень</b> (Shen Rong San Shen Bao) — классика тибетской медицины в форме шариков, изготовленных по древнему рецепту из экологически чистых районов Тибета. <br><br><b>Действие:</b> <br>• Обеспечивает регулярную устойчивую эрекцию, эффективно нормализует половые функции. <br>• Укрепляет почки и предстательную железу. <br>• Повышает либидо и общий жизненный тонус, работает как природный энергетик. <br>• По заявлению производителя, действие сохраняется до 180 часов; совместим с умеренным употреблением алкоголя. <br>• Не вызывает характерных побочных эффектов (тошнота, скачки давления, головная боль) при соблюдении дозировки. <br><br><b>Состав:</b> женьшень, панты (рога) оленя, трава хуаньжунь, кордицепс китайский, тибетский шафран, снежный лотос, вытяжка из семенников тибетского яка, картамин. <br><br><b>Способ применения:</b> половина шарика за 30 минут до близости, запивая тёплой подсоленной водой. Для общего тонуса — 1 шарик раз в 3 дня. Не более 1 шарика в сутки, не совмещать с другими средствами для потенции. <br><br><b>Упаковка:</b> 10 шариков. <br><br><i>Не является лекарственным средством. Противопоказания: беременность, лактация, несовершеннолетний возраст, сердечно-сосудистая недостаточность, гипертония. Консультация врача перед применением обязательна.</i>",
          desc_kk: "<b>Алтын Бұғы</b> (Shen Rong San Shen Bao) — Тибеттің экологиялық таза аймақтарынан алынған көне рецепт бойынша дайындалған, шарик түріндегі тибет медицинасының классикасы. <br><br><b>Әсері:</b> <br>• Тұрақты, үздіксіз эрекцияны қамтамасыз етеді, жыныстық функцияларды тиімді қалыпқа келтіреді. <br>• Бүйрек пен қуық асты безін нығайтады. <br>• Либидо мен жалпы өмірлік тонусты арттырады, табиғи энергетик ретінде әсер етеді. <br>• Өндіруші мәлімдеуінше, әсері 180 сағатқа дейін сақталады; аздап алкоголь қабылдаумен үйлесімді. <br>• Дозаны сақтаған кезде әдеттегі жанама әсерлер (жүрек айнуы, қан қысымының секіруі, бас ауруы) болмайды. <br><br><b>Құрамы:</b> женьшень, бұғы панттары (мүйіздері), хуаньжунь шөбі, қытай кордицепсі, тибет шафраны, қар лотосы, тибет ягының тұқымдық сығындысы, картамин. <br><br><b>Қолдану тәсілі:</b> жақындықтан 30 минут бұрын жарты шарик, жылы тұзды сумен ішіңіз. Жалпы тонус үшін — 3 күнде 1 шарик. Тәулігіне 1 шариктен артық емес, басқа потенция құралдарымен қоспаңыз. <br><br><b>Қаптама:</b> 10 шарик. <br><br><i>Дәрілік зат емес. Қарсы көрсетілімдер: жүктілік, лактация, кәмелетке толмаған жас, жүрек-қантамыр жеткіліксіздігі, гипертония. Қолданар алдында дәрігермен кеңесу міндетті.</i>" },

        { name: "Паста Super Power", name_kk: "Super Power пастасы", price: "10 000 ₸", prefix: "spower",
          desc: "<b>Super Power</b> — паста с максимальной концентрацией трав в нашей линейке эпимедиумных паст. Самый мощный состав для тех, кто ищет усиленный эффект. <br><br><b>Действие:</b> <br>• Интенсивно стимулирует выработку тестостерона. <br>• Повышает либидо, потенцию и общую физическую выносливость. <br>• Оздоравливает мочеполовую систему. <br><br><b>Способ применения:</b> по половине чайной ложки 1 раз в день, вечером после еды. Учитывая высокую концентрацию, в первые дни рекомендуется начинать с меньшей дозы, чтобы оценить индивидуальную реакцию. <br><br><b>Упаковка:</b> 240 г. <br><br><i>Не является лекарственным средством. Не рекомендуется при гипертонии и заболеваниях сердца. Консультация врача перед применением обязательна.</i>",
          desc_kk: "<b>Super Power</b> — эпимедиум пасталары желісіндегі ең жоғары шөп концентрациясы бар паста. Күшейтілген әсерді іздейтіндерге арналған ең қуатты құрам. <br><br><b>Әсері:</b> <br>• Тестостерон өндірісін қарқынды ынталандырады. <br>• Либидо, потенция және жалпы дене төзімділігін арттырады. <br>• Несеп-жыныс жүйесін сауықтырады. <br><br><b>Қолдану тәсілі:</b> күніне 1 рет жарты шай қасық, кешке тамақтан кейін. Жоғары концентрацияны ескере отырып, алғашқы күндері жеке реакцияны бағалау үшін аз дозадан бастау ұсынылады. <br><br><b>Қаптама:</b> 240 г. <br><br><i>Дәрілік зат емес. Гипертония мен жүрек ауруларында қолдану ұсынылмайды. Қолданар алдында дәрігермен кеңесу міндетті.</i>" },

        { name: "Maral Gel", name_kk: "Maral Gel", price: "3 000 ₸", prefix: "maral",
          desc: "<b>Maral Gel</b> — гель на водной основе для наружного применения, с экстрактом корня марала (левзея) и янтарной кислотой. <br><br><b>Особенности:</b> <br>• Водная основа обеспечивает высокую биодоступность действующих компонентов и лёгкое, комфортное нанесение. <br>• Не оставляет следов, запаха и липкого слоя, не вызывает покалывания или жжения. <br>• Не содержит синтетических компонентов и гормонов. <br>• Придаёт интимным моментам больше комфорта и чувственности. <br><br><b>Способ применения:</b> нанести небольшое количество геля на наружные половые органы перед близостью. <br><br><i>Не является лекарственным средством. При индивидуальной чувствительности к компонентам прекратить использование. Хранить в недоступном для детей месте.</i>",
          desc_kk: "<b>Maral Gel</b> — марал (левзея) тамыры сығындысы мен янтарь қышқылы қосылған, сыртқа қолдануға арналған су негізіндегі гель. <br><br><b>Ерекшеліктері:</b> <br>• Су негізі белсенді компоненттердің жоғары биожетімділігін және жеңіл, ыңғайлы жағылуын қамтамасыз етеді. <br>• Із, иіс және жабысқақ қабат қалдырмайды, тітіркену немесе күйдіру сезімін тудырмайды. <br>• Синтетикалық компоненттер мен гормондарды қамтымайды. <br>• Интимдік сәттерге көбірек жайлылық пен сезімталдық қосады. <br><br><b>Қолдану тәсілі:</b> жақындықтан бұрын сыртқы жыныс мүшелеріне аз мөлшерде гель жағыңыз. <br><br><i>Дәрілік зат емес. Құрамдас бөліктерге жеке сезімталдық болса, қолдануды тоқтатыңыз. Балалардың қолы жетпейтін жерде сақтаңыз.</i>" },

        { name: "Мужская сила Arabiyan Med", name_kk: "Arabiyan Med ер қуаты", price: "6 000 ₸", prefix: "amed",
          desc: "<b>Мужская сила Arabiyan Med</b> — травяной сбор в капсулах, 100% BIO состав, обогащённый цинком и селеном — микроэлементами, играющими ключевую роль в синтезе тестостерона и поддержании репродуктивного здоровья мужчины. <br><br><b>Действие:</b> <br>• Цинк участвует в выработке тестостерона и поддержании качества спермы. <br>• Селен обладает антиоксидантным действием, защищает клетки репродуктивной системы. <br>• Растительные компоненты сбора традиционно применяются для повышения либидо и общего тонуса. <br><br><b>Способ применения:</b> согласно инструкции на упаковке, курсом. <br><br><i>Не является лекарственным средством. Консультация врача перед применением рекомендуется.</i>",
          desc_kk: "<b>Arabiyan Med ер қуаты</b> — капсуладағы шөп жинағы, 100% BIO құрам, тестостерон синтезінде және ердің репродуктивті денсаулығын қолдауда шешуші рөл атқаратын мырыш пен селенмен байытылған. <br><br><b>Әсері:</b> <br>• Мырыш тестостерон өндірісіне қатысады және сперма сапасын қолдайды. <br>• Селен антиоксидантты әсер етеді, репродуктивті жүйе жасушаларын қорғайды. <br>• Жинақтың өсімдік компоненттері дәстүрлі түрде либидо мен жалпы тонусты арттыру үшін қолданылады. <br><br><b>Қолдану тәсілі:</b> қаптамадағы нұсқаулыққа сәйкес, курс бойынша. <br><br><i>Дәрілік зат емес. Қолданар алдында дәрігермен кеңесу ұсынылады.</i>" },

        { name: "Fraink Cream", name_kk: "Fraink Cream", price: "2 500 ₸", prefix: "fraink",
          desc: "<b>Fraink Cream</b> — аюрведический крем-пролонгатор индийского производства (Fraink Formulations Ayurvedic) для значительного продления близости. <br><br><b>Действие:</b> <br>• Устраняет проблему преждевременного семяизвержения. <br>• Значительно увеличивает продолжительность полового акта. <br>• Обостряет чувствительность и повышает качество интимной близости. <br><br><b>Состав:</b> оливковое масло, сера, масло семян льна, масло понгамии, масло корицы, масло мака снотворного (папаверы), литсея кубеба, сандаловое масло, гармала обыкновенная, витамины. <br><br><b>Способ применения:</b> небольшое количество крема нанести на кожу перед близостью, согласно инструкции на упаковке. <br><br><b>Объём:</b> 4 мл. <br><br><i>Не является лекарственным средством. Противопоказания: индивидуальная чувствительность к компонентам. Не предназначен для женщин.</i>",
          desc_kk: "<b>Fraink Cream</b> — жақындықты айтарлықтай ұзартуға арналған үнділік аюрведиялық пролонгатор-крем (Fraink Formulations Ayurvedic). <br><br><b>Әсері:</b> <br>• Ерте семяизверждение мәселесін жояды. <br>• Жыныстық актінің ұзақтығын айтарлықтай арттырады. <br>• Сезімталдықты арттырады және интимдік жақындықтың сапасын жақсартады. <br><br><b>Құрамы:</b> зәйтүн майы, күкірт, зығыр тұқымы майы, понгамия майы, дәрәшн майы, апиын көкнәрі майы, литсея кубеба, сандал ағашы майы, үйреншікті гармала, дәрумендер. <br><br><b>Қолдану тәсілі:</b> қаптамадағы нұсқаулыққа сәйкес, жақындықтан бұрын терге аз мөлшерде крем жағыңыз. <br><br><b>Көлемі:</b> 4 мл. <br><br><i>Дәрілік зат емес. Қарсы көрсетілімдер: құрамдас бөліктерге жеке сезімталдық. Әйелдерге арналмаған.</i>" },

        { name: "Сокровище для почек", name_kk: "Бүйрек қазынасы", price: "4 000 ₸", prefix: "kidney",
          desc: "<b>Сокровище для почек</b> (по типу Shen Bao) — китайский препарат на основе традиционных растительных экстрактов для восполнения жизненной энергии, известной в китайской медицине как «Ци» почек. <br><br><b>Действие:</b> <br>• Улучшает функцию почек и способствует выведению токсинов из организма. <br>• Нормализует обмен веществ, поддерживает здоровую работу мочевыделительной системы. <br>• Повышает либидо и способствует нормализации гормонального фона у мужчин. <br>• Рекомендуется при признаках старения и снижении жизненного тонуса, а также при снижении половой функции, связанном со слабостью почек — согласно принципам китайской медицины. <br><br><b>Способ применения:</b> согласно инструкции на упаковке, курсом (как правило, около 1 месяца, при необходимости курс продлевается). <br><br><i>Не является лекарственным средством. Перед применением рекомендуется консультация врача.</i>",
          desc_kk: "<b>Бүйрек қазынасы</b> (Shen Bao түрі) — қытай медицинасында бүйректің «Ци» энергиясы деп аталатын өмірлік энергияны толықтыруға арналған дәстүрлі өсімдік сығындылары негізіндегі қытай препараты. <br><br><b>Әсері:</b> <br>• Бүйрек функциясын жақсартады және ағзадан токсиндерді шығаруға көмектеседі. <br>• Зат алмасуды қалыпқа келтіреді, зәр шығару жүйесінің дұрыс жұмысын қолдайды. <br>• Ерлердегі либидо мен гормоналды фонды қалыпқа келтіруге ықпал етеді. <br>• Қартаю белгілері мен өмірлік тонустың төмендеуі кезінде, сондай-ақ қытай медицинасы қағидалары бойынша бүйректің әлсіздігіне байланысты жыныстық функцияның төмендеуі кезінде ұсынылады. <br><br><b>Қолдану тәсілі:</b> қаптамадағы нұсқаулыққа сәйкес, курс бойынша (әдетте шамамен 1 ай, қажет болса курс ұзартылады). <br><br><i>Дәрілік зат емес. Қолданар алдында дәрігермен кеңесу ұсынылады.</i>" },

        { name: "Africa Black Ant King", name_kk: "Africa Black Ant King", price: "4 000 ₸", prefix: "ant",
          desc: "<b>Africa Black Ant King</b> — знаменитый препарат «Чёрный муравей» на основе экстрактов диких чёрных муравьёв и традиционных китайских трав. <br><br><b>Действие:</b> <br>• Действие наступает через 15–20 минут после приёма. <br>• Улучшает эрекцию, продлевает половой акт. <br>• Способствует профилактике простатита и раннего семяизвержения. <br>• По заявлению производителя, эффект сохраняется длительное время (по разным данным — до нескольких суток). <br><br><b>Состав:</b> экстракт диких чёрных муравьёв, волчьи ягоды (годжи), тибетский коргонг, шафран и другие традиционные растительные компоненты. <br><br><b>Способ применения:</b> 1 таблетка за 15–20 минут до близости, запивая большим количеством воды (не алкоголем). Не более 1 таблетки в 24 часа. <br><br><i>Не является лекарственным средством. Не совмещать с другими средствами для потенции. Не рекомендуется женщинам, несовершеннолетним и при индивидуальной непереносимости. При длительной нежелательной эрекции необходимо выпить много холодной воды и обратиться к врачу.</i>",
          desc_kk: "<b>Africa Black Ant King</b> — жабайы қара құмырсқалар сығындысы мен дәстүрлі қытай шөптері негізіндегі әйгілі «Қара құмырсқа» препараты. <br><br><b>Әсері:</b> <br>• Әсері қабылдағаннан кейін 15–20 минутта басталады. <br>• Эрекцияны жақсартады, жыныстық актіні ұзартады. <br>• Простатит пен ерте семяизверждениенің алдын алуға ықпал етеді. <br>• Өндіруші мәлімдеуінше, әсері ұзақ уақыт сақталады (әртүрлі деректер бойынша — бірнеше тәулікке дейін). <br><br><b>Құрамы:</b> жабайы қара құмырсқа сығындысы, годжи жидектері, тибет коргонгы, шафран және басқа да дәстүрлі өсімдік компоненттері. <br><br><b>Қолдану тәсілі:</b> жақындықтан 15–20 минут бұрын 1 таблетка, көп мөлшерде сумен (алкогольмен емес) ішіңіз. 24 сағатта 1 таблеткадан артық емес. <br><br><i>Дәрілік зат емес. Басқа потенция құралдарымен қоспаңыз. Әйелдерге, кәмелетке толмағандарға және жеке төзбеушілік кезінде ұсынылмайды. Қалаусыз эрекция ұзақ сақталса, көп мөлшерде суық су ішіп, дәрігерге жүгініңіз.</i>" },

        { name: "Sealex Forte", name_kk: "Sealex Forte", price: "4 000 ₸", prefix: "sealex",
          desc: "<b>Sealex Forte</b> — натуральная добавка для мужчин на основе глицирризиновой кислоты и панаксозидов (действующих веществ женьшеня), способствующая улучшению притока крови. Не вызывает привыкания. <br><br><b>Действие:</b> <br>• Компоненты состава способствуют увеличению уровня оксида азота (NO), необходимого для реализации эректильной функции. <br>• Витамины B6 и B12 выполняют защитную функцию для сосудов, обладают антиоксидантным действием. <br>• Цинк играет важную роль в синтезе мужских половых гормонов. <br><br><b>Способ применения:</b> взрослым мужчинам по 1 капсуле 1 раз в день во время еды, курсом 1 месяц. При необходимости приём можно повторить после перерыва. Для разового эффекта — 1 капсула за 1–1,5 часа до близости. <br><br><i>Не является лекарственным средством. Противопоказания: индивидуальная непереносимость компонентов.</i>",
          desc_kk: "<b>Sealex Forte</b> — глициррин қышқылы мен панаксозидтер (женьшеньнің белсенді заттары) негізіндегі, қан ағымын жақсартуға ықпал ететін ерлерге арналған табиғи қоспа. Тәуелділік тудырмайды. <br><br><b>Әсері:</b> <br>• Құрамдас бөліктер эректильді функцияны іске асыру үшін қажетті азот тотығының (NO) деңгейін арттыруға ықпал етеді. <br>• B6 және B12 дәрумендері тамырларды қорғау функциясын атқарады, антиоксидантты әсер етеді. <br>• Мырыш ерлердің жыныс гормондарын синтездеуде маңызды рөл атқарады. <br><br><b>Қолдану тәсілі:</b> ересек еркектерге күніне 1 рет тамақ ішу кезінде 1 капсула, 1 ай курс бойынша. Қажет болса, үзілістен кейін қабылдауды қайталауға болады. Бір реттік әсер үшін — жақындықтан 1–1,5 сағат бұрын 1 капсула. <br><br><i>Дәрілік зат емес. Қарсы көрсетілімдер: құрамдас бөліктерге жеке төзбеушілік.</i>" },

        { name: "Снайпер", name_kk: "Снайпер", price: "4 000 ₸", prefix: "sniper",
          desc: "<b>Снайпер</b> — точечный стимулятор в таблетках на основе комплекса традиционных китайских компонентов для быстрого восстановления мужской силы. <br><br><b>Действие:</b> <br>• Стимулирует сексуальную функцию, обостряет чувствительность. <br>• Способствует усилению эрекции непосредственно перед близостью. <br>• Придаёт бодрость и энергию. <br><br><b>Состав:</b> женьшень, родиола розовая, эпимедиум, морской конёк, самец шелкопряда (питает печень и почки, укрепляет мужское здоровье), оленья плацента (тонизирует почки, устраняет слабость и усталость), панты оленя (стимулируют спермагенез и повышают уровень тестостерона). <br><br><b>Способ применения:</b> при лёгкой форме достаточно 1/3 таблетки; для полного эффекта — 1 таблетка за 10–20 минут до близости. Не совмещать с другими препаратами для повышения потенции. <br><br><i>Не является лекарственным средством. Консультация врача перед применением рекомендуется.</i>",
          desc_kk: "<b>Снайпер</b> — ер қуатын тез қалпына келтіруге арналған дәстүрлі қытай компоненттерінің кешені негізіндегі таблеткадағы нүктелік стимулятор. <br><br><b>Әсері:</b> <br>• Жыныстық функцияны ынталандырады, сезімталдықты арттырады. <br>• Жақындықтың алдында эрекцияны күшейтуге ықпал етеді. <br>• Сергектік пен энергия береді. <br><br><b>Құрамы:</b> женьшень, раушан родиоласы, эпимедиум, теңіз аты, жібек құрты еркегі (бауыр мен бүйректі қоректендіреді, ер денсаулығын нығайтады), бұғы плацентасы (бүйректі тонизирлейді, әлсіздік пен шаршауды жояды), бұғы панттары (сперматогенезді ынталандырады және тестостерон деңгейін арттырады). <br><br><b>Қолдану тәсілі:</b> жеңіл түрде таблетканың 1/3 бөлігі жеткілікті; толық әсер үшін — жақындықтан 10–20 минут бұрын 1 таблетка. Потенцияны арттыруға арналған басқа препараттармен қоспаңыз. <br><br><i>Дәрілік зат емес. Қолданар алдында дәрігермен кеңесу ұсынылады.</i>" }
    ];
    const list = document.getElementById('product-list');
    products.forEach(p => {
        const images = [1,2,3,4,5].map(i => `${p.prefix}_${i}.jpg`);
        const card = document.createElement('div'); card.className = 'product-card';
        card.innerHTML = `<div class="carousel-box"><div class="track">${images.map((img, idx) => `<div class="slide" onclick='openStory(${JSON.stringify(images)}, ${idx})'><img src="${img}" onerror="if(this.dataset.tried)this.parentElement.style.display='none';this.dataset.tried=1;this.src='placeholder.jpg';"></div>`).join('')}</div></div><div class="dots">${images.map((_, i) => `<div class="dot${i===0?' active':''}"></div>`).join('')}</div><div class="info"><h3><span class="lang-ru">${p.name}</span><span class="lang-kk">${p.name_kk}</span></h3><div class="price">${p.price}</div><button class="desc-btn"><span class="state-more"><span class="lang-ru">ПОДРОБНЕЕ ▾</span><span class="lang-kk">ТОЛЫҒЫРАҚ ▾</span></span><span class="state-less" style="display:none"><span class="lang-ru">СВЕРНУТЬ ▴</span><span class="lang-kk">ЖАБУ ▴</span></span></button><div class="desc-content"><p class="lang-ru">${p.desc}</p><p class="lang-kk">${p.desc_kk}</p></div><a href="https://wa.me/77781754241?text=${encodeURIComponent('Ассалямуалейкум! Я хочу заказать: ' + p.name)}" class="wa-btn"><span class="lang-ru">ЗАКАЗАТЬ</span><span class="lang-kk">ТАПСЫРЫС БЕРУ</span></a></div>`;
        list.appendChild(card);
        const track = card.querySelector('.track'); const dots = card.querySelectorAll('.dot');
        track.addEventListener('scroll', () => { const i = Math.round(track.scrollLeft / track.offsetWidth); dots.forEach((d, n) => d.classList.toggle('active', n === i)); }, { passive: true });
        const btn = card.querySelector('.desc-btn'); const content = card.querySelector('.desc-content');
        const stateMore = btn.querySelector('.state-more'); const stateLess = btn.querySelector('.state-less');
        btn.addEventListener('click', () => {
            const open = content.style.display === 'block';
            content.style.display = open ? 'none' : 'block';
            stateMore.style.display = open ? 'block' : 'none';
            stateLess.style.display = open ? 'none' : 'block';
        });
    });
    const viewer = document.getElementById('story-viewer'); const storyTrack = document.getElementById('story-track'); let startY = 0;
    function openStory(images, start) {
        storyTrack.innerHTML = ''; document.getElementById('story-progress').innerHTML = '';
        images.forEach(src => {
            const s = document.createElement('div'); s.className = 'story-slide'; s.innerHTML = `<img src="${src}">`; storyTrack.appendChild(s);
            const b = document.createElement('div'); b.className = 'story-bar'; b.innerHTML = `<div class="story-fill"></div>`; document.getElementById('story-progress').appendChild(b);
        });
        viewer.style.display = 'flex'; document.body.style.overflow = 'hidden';
        setTimeout(() => { storyTrack.scrollLeft = storyTrack.offsetWidth * start; updateStory(); }, 50);
    }
    function updateStory() { const index = Math.round(storyTrack.scrollLeft / storyTrack.offsetWidth); document.querySelectorAll('.story-fill').forEach((f, i) => { f.style.width = i <= index ? '100%' : '0%'; f.style.opacity = i === index ? '1' : (i < index ? '0.6' : '0.3'); }); }
    storyTrack.addEventListener('scroll', updateStory, { passive: true });
    function closeStory() { viewer.style.display = 'none'; document.body.style.overflow = ''; }
    viewer.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
    viewer.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - startY > 80) closeStory(); }, { passive: true });

    // ПРИМЕНЯЕМ ЯЗЫК, ВЫБРАННЫЙ РАНЕЕ НА ГЛАВНОЙ СТРАНИЦЕ
    window.addEventListener('DOMContentLoaded', function() {
        if (localStorage.getItem('preferredLang') === 'kz') {
            document.getElementById('mainBody').classList.add('kz-mode');
        }
    });
    </script>
